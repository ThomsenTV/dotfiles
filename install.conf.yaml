- defaults:
    link:
      relink: true
      type: symlink

- clean: ['~']

- link:
    ~/.zshrc: .zshrc
    ~/.bashrc: .bashrc
    ~/.gitconfig: .gitconfig
    ~/.config/rofi: .config/rofi
    ~/.config/nvim: .config/nvim
    ~/.config/kitty: .config/kitty
    ~/.config/godot: .config/godot
    ~/.config/hypr: .config/hypr
    ~/.config/waybar: .config/waybar
    ~/rclone/rclone-bisync: rclone-bisync

- create:
    - ~/.vim/undo-history
    - ~/rclone
    - ~/rclone/logs

- shell:
  - [git submodule update --init --recursive, Installing submodules]
